[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hereditaria-os"
version = "0.1.0"
description = "HEREDITARIA™ OS — Sistema operativo de bienestar inmobiliario"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Nota: mypy y ruff se instalan por separado en CI (Ubuntu).
# En Termux: pkg install mypy ruff  (o omitir, CI las valida)

[tool.setuptools]
packages = ["her_models"]
package-dir = {"" = "packages"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["packages.her_models"]
