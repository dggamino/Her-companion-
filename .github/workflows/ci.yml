name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate governance structure
        run: |
          echo "=== Validating governance documents ==="
          for file in \
            governance/HER-001-Manifiesto.md \
            governance/constitution.md \
            governance/decisions.md \
            governance/adr/HER-ADR-0000.md \
            governance/rfc/HER-RFC-001.md \
            governance/std/HER-STD-0001.md \
            governance/std/HER-STD-0002.md \
            governance/std/HER-STD-0003.md \
            governance/std/HER-STD-0004.md \
            governance/std/HER-STD-0005.md \
            governance/resolutions/AR-2026-07-31-001.md \
            governance/issues/SPRINT-001.md \
            governance/issues/SPRINT-002.md \
            governance/issues/SPRINT-003.md \
            governance/issues/SPRINT-004.md \
            governance/issues/SPRINT-005.md
          do
            if [ -f "$file" ]; then
              echo "  ✅ $file"
            else
              echo "  ❌ MISSING: $file"
              exit 1
            fi
          done
          echo "=== All governance documents present ==="

      - name: Validate shell scripts syntax
        run: |
          echo "=== Validating shell scripts ==="
          for script in install.sh termux_setup.sh scripts/update.sh; do
            if [ -f "$script" ]; then
              bash -n "$script"
              echo "  ✅ $script"
            else
              echo "  ⚠️ Not found: $script"
            fi
          done

      - name: Check for broken internal links
        run: |
          echo "=== Checking internal references ==="
          grep -r "HER-ADR-007\|HER-ADR-009" governance/ && exit 1 || echo "  ✅ No references to non-existent ADRs"

  python-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (placeholder)
        run: |
          echo "=== Python environment ready ==="
          echo "  Python version: $(python --version)"
          echo "  Placeholder for future: pytest, mypy, ruff"
          echo "  Activate when her-models/ her-core/ are added"
